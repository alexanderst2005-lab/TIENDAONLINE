<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Monatela Boutique</title>
  <link rel="stylesheet" href="css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-box">
      <div class="login-logo">
        <svg width="150" height="40" viewBox="0 0 150 40" xmlns="http://www.w3.org/2000/svg">
          <text x="10" y="25" font-family="'Didot', serif" font-size="24" font-weight="bold" fill="#111111" letter-spacing="2">MONATELA</text>
        </svg>
      </div>
      <h2>Panel Administrativo</h2>
      <p>Inicia sesión para gestionar tu tienda</p>
      
      <div id="loginError" class="alert-error" style="display: none;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" required placeholder="admin@monatela.com">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="password" required placeholder="••••••••">
            <button type="button" class="btn-toggle-password" id="togglePassword">Mostrar</button>
          </div>
        </div>
        <button type="submit" class="btn-primary btn-block" id="loginBtn">Iniciar Sesión</button>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
