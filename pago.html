<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Estado de Pago — Monatela Boutique</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: #f7f7f7; color: #333; min-height: 100vh; }

    .pay-header {
      background: #111;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    .pay-header-logo { color: #fff; font-weight: 700; font-size: 16px; letter-spacing: 1px; }

    #status-screen { max-width: 520px; margin: 40px auto; padding: 20px; }
    .status-card { background: #fff; border-radius: 16px; padding: 32px 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); text-align: center; margin-bottom: 20px; }
    
    .status-icon { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
    .icon-success { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .icon-failure { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .icon-pending { background: linear-gradient(135deg, #f59e0b, #d97706); }
    
    .status-title { font-size: 24px; font-weight: 700; color: #111; margin-bottom: 6px; }
    .status-subtitle { font-size: 14px; color: #666; margin-bottom: 28px; }
    .status-amount { font-size: 40px; font-weight: 800; margin-bottom: 28px; }
    
    .color-success { color: #16a34a; }
    .color-failure { color: #dc2626; }
    .color-pending { color: #d97706; }

    .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f5f5f5; font-size: 14px; }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #888; }
    .info-value { color: #111; font-weight: 500; text-align: right; max-width: 60%; }
    
    .action-btn { width: 100%; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; border: none; margin-bottom: 10px; }
    .btn-primary-action { background: #111; color: #fff; }
    .btn-primary-action:hover { background: #333; }
    .btn-secondary-action { background: #f5f5f5; color: #333; }
    .btn-secondary-action:hover { background: #eee; }
  </style>
</head>
<body>

  <div class="pay-header">
    <span class="pay-header-logo">Monatela Boutique</span>
  </div>

  <div id="status-screen">
    <div class="status-card">
      <div class="status-icon" id="s-icon"></div>
      <h1 class="status-title" id="s-title">Procesando...</h1>
      <p class="status-subtitle" id="s-subtitle">Revisando estado del pago</p>
      <div class="status-amount" id="s-amount"></div>

      <div style="text-align:left; margin-top: 10px;">
        <div class="info-row"><span class="info-label">N.° de Pedido</span><span class="info-value" id="s-order"></span></div>
        <div class="info-row"><span class="info-label">ID Transacción</span><span class="info-value" id="s-txid" style="font-size:11px;"></span></div>
      </div>
    </div>

    <button id="btn-print" class="action-btn btn-primary-action" onclick="window.print()" style="display:none;">
      🖨️ Descargar comprobante
    </button>
    <button class="action-btn btn-secondary-action" onclick="window.location.href='/'">
      ← Volver a la tienda
    </button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const status = params.get('status');
    const orderNumber = params.get('order') || '';
    const total = parseInt(params.get('total') || '0', 10);
    const paymentId = params.get('payment_id') || '—';

    function formatCurrency(n) {
      return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(n);
    }

    if (!status) {
      window.location.href = '/';
    } else {
      document.getElementById('s-amount').textContent = formatCurrency(total);
      document.getElementById('s-order').textContent = orderNumber;
      document.getElementById('s-txid').textContent = paymentId;

      const iconEl = document.getElementById('s-icon');
      const titleEl = document.getElementById('s-title');
      const subEl = document.getElementById('s-subtitle');
      const amountEl = document.getElementById('s-amount');

      if (status === 'success' || status === 'approved') {
        iconEl.className = 'status-icon icon-success';
        iconEl.innerHTML = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
        titleEl.textContent = '¡Pago aprobado!';
        subEl.textContent = 'Tu pedido ha sido confirmado. Enviaremos los detalles por correo.';
        amountEl.className = 'status-amount color-success';
        document.getElementById('btn-print').style.display = 'block';
      } else if (status === 'pending') {
        iconEl.className = 'status-icon icon-pending';
        iconEl.innerHTML = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
        titleEl.textContent = 'Pago pendiente';
        subEl.textContent = 'Tu pago está siendo procesado. Te avisaremos cuando se confirme.';
        amountEl.className = 'status-amount color-pending';
      } else {
        iconEl.className = 'status-icon icon-failure';
        iconEl.innerHTML = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
        titleEl.textContent = 'Pago rechazado';
        subEl.textContent = 'Hubo un problema con tu pago. Por favor intenta nuevamente.';
        amountEl.className = 'status-amount color-failure';
      }
    }
  </script>
</body>
</html>
