<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasarela de Pago Segura</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f7f9fa;
      color: #1a1f36;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .payment-container {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(50, 50, 93, 0.1), 0 5px 15px rgba(0, 0, 0, 0.07);
      overflow: hidden;
    }
    .header {
      background: #111111;
      padding: 30px 20px;
      text-align: center;
      color: #ffffff;
    }
    .store-name {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.8;
      margin-bottom: 10px;
    }
    .amount {
      font-size: 32px;
      font-weight: 700;
    }
    .content {
      padding: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #3c4257;
    }
    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #e3e8ee;
      border-radius: 5px;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: #111111;
      box-shadow: 0 0 0 3px rgba(17, 17, 17, 0.1);
    }
    .flex-row {
      display: flex;
      gap: 15px;
    }
    .flex-row .form-group {
      flex: 1;
    }
    .btn-pay {
      width: 100%;
      padding: 14px;
      background: #111111;
      color: #ffffff;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .btn-pay:hover {
      background: #333333;
    }
    .btn-pay:disabled {
      background: #999999;
      cursor: not-allowed;
    }
    .footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #8792a2;
      border-top: 1px solid #e3e8ee;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* Success state */
    #success-state {
      display: none;
      text-align: center;
      padding: 40px 30px;
    }
    .check-circle {
      width: 64px;
      height: 64px;
      background: #24b47e;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
    }
  </style>
</head>
<body>

  <div class="payment-container" id="payment-box">
    <div class="header">
      <div class="store-name">Monatela Boutique</div>
      <div class="amount" id="display-amount">$0</div>
      <div style="font-size: 13px; margin-top: 5px; opacity: 0.7;">Pedido #<span id="display-order"></span></div>
    </div>
    
    <div class="content" id="payment-form-container">
      <div style="background: #e0f2fe; color: #0369a1; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 25px; border: 1px solid #bae6fd;">
        <strong>Modo de Prueba:</strong> Ingresa cualquier dato. El pago será simulado y tu pedido quedará registrado como Confirmado.
      </div>

      <form id="pay-form">
        <div class="form-group">
          <label>Número de Tarjeta</label>
          <input type="text" class="form-control" placeholder="0000 0000 0000 0000" maxlength="19" required value="4242 4242 4242 4242">
        </div>
        <div class="form-group">
          <label>Nombre en la Tarjeta</label>
          <input type="text" class="form-control" placeholder="Nombre completo" required>
        </div>
        <div class="flex-row">
          <div class="form-group">
            <label>Expiración</label>
            <input type="text" class="form-control" placeholder="MM/AA" maxlength="5" required value="12/28">
          </div>
          <div class="form-group">
            <label>CVC</label>
            <input type="text" class="form-control" placeholder="123" maxlength="4" required value="123">
          </div>
        </div>
        <button type="submit" class="btn-pay" id="btn-submit">
          <span class="spinner" id="btn-spinner"></span>
          <span id="btn-text">Pagar</span>
        </button>
      </form>
    </div>

    <div id="success-state">
      <div class="check-circle">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h2 style="margin-bottom: 10px; font-size: 22px;">¡Pago Exitoso!</h2>
      <p style="color: #4a5568; font-size: 14px; margin-bottom: 25px; line-height: 1.5;">Tu pedido ha sido procesado y confirmado en el sistema.</p>
      <button class="btn-pay" onclick="window.location.href='index.html'" style="margin-top: 0;">Volver a la Tienda</button>
    </div>

    <div class="footer" id="footer-box">
      🔒 Pagos procesados de forma segura
    </div>
  </div>

  <script>
    // Format currency
    const formatCurrency = (val) => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP' }).format(val);

    // Get params
    const urlParams = new URLSearchParams(window.location.search);
    const orderNumber = urlParams.get('order');
    const total = parseInt(urlParams.get('total') || '0', 10);

    if (!orderNumber || !total) {
      alert('Error en los datos de pago.');
      window.location.href = 'index.html';
    }

    document.getElementById('display-amount').textContent = formatCurrency(total);
    document.getElementById('display-order').textContent = orderNumber;

    document.getElementById('pay-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btn-submit');
      const text = document.getElementById('btn-text');
      const spinner = document.getElementById('btn-spinner');

      // UI Loading state
      btn.disabled = true;
      text.textContent = 'Procesando...';
      spinner.style.display = 'block';

      try {
        // Send payment mock confirmation to backend
        const response = await fetch('/api/pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderNumber })
        });

        const data = await response.json();
        
        // Add fake delay to simulate network/bank processing
        setTimeout(() => {
          if (response.ok) {
            document.getElementById('payment-form-container').style.display = 'none';
            document.getElementById('footer-box').style.display = 'none';
            document.getElementById('success-state').style.display = 'block';
          } else {
            alert('El pago fue rechazado. Intenta nuevamente.');
            btn.disabled = false;
            text.textContent = 'Pagar';
            spinner.style.display = 'none';
          }
        }, 1500);

      } catch (err) {
        console.error(err);
        alert('Error de conexión con la pasarela.');
        btn.disabled = false;
        text.textContent = 'Pagar';
        spinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
